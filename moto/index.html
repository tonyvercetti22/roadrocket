<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2"><link rel="shortcut icon" href="favicon.ico?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>RoadRocket Moto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"></noscript>
<style>
:root{
  --bg:#121417;--surf:#1b1e23;--surf2:#262a31;--line:#2e333a;--ink:#f2f4f7;--muted:#b4bac3;--hint:#8b929c;
  --brand:#5b7cff;--brand-ink:#fff;--link:#8fa6ff;--up:#3fd17f;--down:#ff6f6f;--gold:#e9b949;
  --r-big:12px;--r-small:8px;--shadow:0 10px 40px rgba(0,0,0,.45);
  --head:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs:18px;
}
:root[data-theme="light"]{
  --bg:#ffffff;--surf:#f4f5f7;--surf2:#e8ebef;--line:#d9dde3;--ink:#111418;--muted:#4a515b;--hint:#6b727c;
  --brand:#1a3fb8;--link:#1a3fb8;--up:#137a3c;--down:#c0262b;--gold:#9a6a00;--shadow:0 10px 40px rgba(0,0,0,.15);
}
:root[data-size="big"]{--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 var(--fs)/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
h1,h2,h3,.head{font-family:var(--head);font-weight:800;letter-spacing:-.01em;line-height:1.15;margin:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}.mut{color:var(--muted)}.hint{color:var(--hint);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-small);border:1px solid var(--line);background:var(--surf);font-weight:600;font-size:16px}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:15px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-big)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;background:var(--surf);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.above{color:var(--down)}.tag.fair{color:var(--muted)}.tag.below{color:var(--up)}.tag.low{color:var(--gold)}
input[type=text],input[type=email],select{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-small);padding:0 12px}
label.f{display:block;font-size:15px;color:var(--muted);margin:12px 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* SHELL */
.app{display:grid;grid-template-columns:268px 1fr;height:calc(100vh / var(--z,1))}
.app.closed{grid-template-columns:64px 1fr}
.app.closed .hide-closed{display:none!important}
.app.closed .side{padding:12px 8px;align-items:center}
.side{background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;overflow:auto;min-width:0}
.side-top{display:flex;align-items:center;gap:6px;width:100%}
.side .logo-s{font-family:var(--head);font-weight:800;font-size:21px;background:none;border:none;padding:4px 6px;text-align:left;letter-spacing:-.02em}
.newchat{width:100%;justify-content:flex-start;background:var(--bg)}
.app.closed .newchat{width:44px;padding:0;justify-content:center}
.logo-s b,.logo b{color:var(--brand)}
.side h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);margin:18px 6px 6px;font-weight:700}
.side .chatlink{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:var(--r-small);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.side .chatlink:hover,.side .chatlink.on{background:var(--surf2);color:var(--ink)}
.mainc{display:flex;flex-direction:column;min-width:0;height:calc(100vh / var(--z,1))}
.top{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid var(--line);min-height:64px}
.top .tabs{display:flex;gap:6px;margin-left:auto}
.tabbtn{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;border-radius:var(--r-small);font-weight:500;color:var(--muted);font-size:18px}
.tabbtn:hover{background:var(--surf)}
.tabbtn.on{color:var(--ink);font-weight:700;border-bottom-color:var(--brand);border-radius:var(--r-small) var(--r-small) 0 0}
.top .bellw{margin-left:10px}
.iconbtn{background:none;border:1px solid transparent;border-radius:var(--r-small);min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.iconbtn:hover{border-color:var(--line)}
.badge{position:absolute;top:4px;right:2px;background:var(--down);color:#fff;font-size:12px;font-weight:700;border-radius:999px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;border:none;font-weight:700;margin-left:4px}
.phonly{display:none}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.side-foot .avatar{margin-left:0;flex:none}
.vswitch{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.vswitch button{background:none;border:none;border-radius:999px;width:40px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--hint)}
.vswitch button:hover{color:var(--ink)}
.vswitch button.on{background:var(--surf2);color:var(--ink)}
.vswitch svg.i{width:22px;height:22px;stroke-width:1.7}
.app.closed .side-foot{flex-direction:column;border-top:none}
.app.closed .vswitch{flex-direction:column}
.view{flex:1;overflow:auto;position:relative}
.wrap{max-width:1080px;margin:0 auto;padding:24px 28px 40px}
.dock{border-top:1px solid var(--line);padding:12px 20px;background:var(--bg)}
.dock .ask{max-width:860px;margin:0 auto}
.bottom{display:none}
.pagetitle{font-size:30px;margin:4px 0 4px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--link);font-weight:600;padding:6px 0;margin-bottom:6px;font-size:16px}

/* ASK BAR */
.ask{display:flex;align-items:center;gap:6px;border:2px solid #3a4252;border-radius:var(--r-big);padding:6px;background:#000;color:#fff;position:relative}
.ask input{color:#fff}.ask .iconbtn:hover{border-color:#3a4252}.ask .attach{background:#222;color:#fff}
.ask:focus-within{border-color:#5b7cff}
.ask input{flex:1;border:none;outline:none;background:none;min-width:0;padding:10px 6px;font-size:18px}
.ask input::placeholder{color:#9aa3b2}
.ask .iconbtn{min-width:42px;min-height:42px}
.ask .send{background:var(--brand);color:#fff;border:none;border-radius:var(--r-small);min-height:42px;padding:0 18px;font-weight:700}
.ask.listening{border-color:var(--down)}
.ask.listening .mic{color:var(--down);border-color:var(--down)}
.attach{display:inline-flex;gap:6px;align-items:center;font-size:14px;background:var(--surf2);border-radius:999px;padding:2px 10px;margin-left:4px;white-space:nowrap}
.pop{position:absolute;z-index:30;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-big);box-shadow:var(--shadow);padding:6px;min-width:250px}
.pop button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:none;text-align:left;padding:10px 12px;border-radius:var(--r-small);font-size:16px}
.pop button:hover{background:var(--surf2)}
.pop hr{border:none;border-top:1px solid var(--line);margin:6px 0}

/* INTEL HOME */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px 56px}
.logo{font-family:var(--head);font-weight:800;font-size:44px;letter-spacing:-.02em;margin:0}
.greet{font-size:18px;color:var(--muted);margin:2px 0 28px}
.home .ask{width:100%;max-width:720px}
.boxes{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-big);padding:16px;text-align:left;min-height:118px;transition:border-color .1s,transform .1s}
.box:hover{border-color:var(--brand);transform:translateY(-1px)}
.box h3{font-size:19px;margin-bottom:6px}
.box p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box>span:nth-child(2){min-width:0;display:block}

/* CHAT */
.chat{max-width:820px;margin:0 auto;padding:24px 24px 40px}
.msg-u{margin:18px 0 10px auto;max-width:80%;background:var(--surf2);border-radius:var(--r-big);padding:10px 16px;width:fit-content}
.msg-a p{margin:0 0 12px}
.msg-a .who{font-size:14px;font-weight:700;color:var(--link);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
.pcard{border:1px solid var(--line);border-radius:var(--r-big);background:var(--surf);padding:16px 18px;margin:12px 0 6px}
.pcard .lbl{font-size:14px;color:var(--muted)}
.pcard .big{font-family:var(--head);font-size:36px;font-weight:800;line-height:1.05}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.pgrid div b{display:block;font-size:19px}
.source{background:none;border:none;padding:4px 0;color:var(--link);font-size:15px;text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fups{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.fups .chip{cursor:pointer;font-size:15px}
.fups .chip:hover{border-color:var(--brand)}
.rows{width:100%;border-collapse:collapse;font-size:16px}
.rows th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf)}
.rows td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.rows tr.click{cursor:pointer}.rows tr.click:hover td{background:var(--surf2)}
.num{text-align:right;white-space:nowrap}
.skel{background:linear-gradient(90deg,var(--surf) 0%,var(--surf2) 50%,var(--surf) 100%);background-size:200% 100%;animation:sk 1s infinite;border-radius:var(--r-big);height:118px;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}

/* CARS */
.photo{aspect-ratio:4/3;border-radius:var(--r-small);display:flex;align-items:flex-end;justify-content:flex-start;padding:6px 8px;color:rgba(255,255,255,.9);font:700 13px var(--head);letter-spacing:.04em;position:relative;overflow:hidden;flex:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lotph .photo span{display:none}
.photo svg{position:absolute;inset:18% 8% auto 8%;width:84%;height:auto;stroke:rgba(255,255,255,.55);fill:none;stroke-width:3}
.carrow{display:grid;grid-template-columns:150px 1fr auto;gap:16px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
.carrow:hover{background:var(--surf)}
.carrow h3{font-size:20px}
.carrow .spec{font-size:15px;color:var(--muted);margin:4px 0}
.carrow .price{text-align:right;min-width:150px}
.carrow .price .p{font-family:var(--head);font-size:26px;font-weight:800}
.contacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.carrow .contacts{grid-column:2/-1;margin-top:0}
.contacts .btn{min-height:38px;font-size:14px;padding:0 10px}
.star{background:none;border:none;min-width:40px;min-height:40px;color:var(--hint)}
.star.on{color:var(--gold)}.star.on svg{fill:var(--gold)}
.layout2{display:grid;grid-template-columns:250px 1fr;gap:24px}
.filters{position:sticky;top:0;align-self:start}
.filters .card{padding:14px}
.filters h4{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint)}
.ck{display:flex;align-items:center;gap:8px;font-size:15px;margin:6px 0}
.ck input{width:18px;height:18px}
.ftags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.saved{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);cursor:pointer}
.saved:hover{background:var(--surf)}
.saved .new{margin-left:auto;font-weight:700;color:var(--link);white-space:nowrap}
.carhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
.sect{margin-top:26px}
.sect h2{font-size:26px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kv div{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-big);padding:12px 14px}
.kv span{display:block;font-size:14px;color:var(--muted)}.kv b{font-size:20px}
.bar{height:10px;background:var(--surf2);border-radius:99px;position:relative;margin:8px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--down)}
.bar em{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink)}
.lotstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 12px}
.lotstats div{background:var(--surf);border:1px solid var(--hair,var(--line));border-radius:12px;padding:14px 16px}
.lotstats span{display:block;font-size:14px;color:var(--muted)}.lotstats b{display:block;font-size:26px;margin:2px 0}
.lotcharts{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:8px}
.lotcharts .card{padding:16px 18px}.lotcharts h3{font-size:17px;margin:0 0 2px}
.lotcharts svg{width:100%;height:auto;display:block;margin-top:8px}
.lotcharts svg text{fill:var(--hint);font-size:13px}
.dayrow{display:grid;grid-template-columns:minmax(150px,auto) 1fr 34px;gap:10px;align-items:center;font-size:15px;margin:6px 0}
.dayrow .bar{margin:0}.dayrow b{text-align:right}
.lotgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lotcard{background:var(--surf);border:1px solid var(--hair,var(--line));border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s}
.lotcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px)}
.lc-live{font-size:14px;font-weight:600;color:var(--brand);margin-top:4px}
.lotcard .photo{border-radius:0;aspect-ratio:16/10;height:auto}
.lc-body{padding:12px 14px 14px}.lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lc-top b{font-size:16px;line-height:1.3}.lc-top .tag{flex-shrink:0}
.lc-price{margin-top:10px}.lc-price b{font-size:22px;display:block}
.lc-days{margin-top:8px;font-size:14px}.lc-days.slow{color:var(--down)}
@media (max-width:760px){.lotstats{grid-template-columns:1fr 1fr}.lotcharts{grid-template-columns:1fr}}

/* INVEST */
.switch{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-small);overflow:hidden;margin:10px 0 16px}
.switch button{background:none;border:none;padding:10px 20px;min-height:44px;font-weight:600;color:var(--muted)}
.switch button.on{background:var(--brand);color:#fff}
.ranges{display:flex;gap:6px;margin:10px 0}
.ranges button{min-height:38px;padding:0 14px;border-radius:var(--r-small);border:1px solid var(--line);background:none;font-weight:600}
.ranges button.on{background:var(--surf2);border-color:var(--ink)}
.chartbox{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-big);padding:12px}

/* ACCOUNT */
.acc section{margin-bottom:26px}
.acc h2{font-size:26px;margin-bottom:10px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--surf2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw.on{background:var(--brand);border-color:var(--brand)}.sw.on::after{left:23px;background:#fff}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tiers .card{padding:16px}

/* OVERLAYS */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-big);max-width:560px;width:100%;max-height:calc(88vh / var(--z,1));overflow:auto;padding:20px;box-shadow:var(--shadow)}
.sheet h2{font-size:28px;margin-bottom:6px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-big);padding:14px;margin-top:10px}
.opt:hover{border-color:var(--brand)}
.opt b{display:block}.opt span{font-size:15px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r-small);font-weight:600;z-index:60;font-size:15px;max-width:90vw;text-align:center}
.bellpop{right:70px;top:58px;width:400px;padding:8px}
.pop button.alert{display:block;width:100%;text-align:left;background:none;border:none;border-radius:var(--r-small);padding:10px 12px}
.alert:hover{background:var(--surf2)}
.alert .t{font-size:13px;color:var(--hint)}
.alert.money b{color:var(--up)}
.tour{position:fixed;z-index:70;background:var(--brand);color:#fff;border-radius:var(--r-big);padding:16px 18px;max-width:330px;box-shadow:var(--shadow)}
.tour .btn{background:#fff;color:var(--brand);border:none}
.tour .skip{background:none;border:none;color:#fff;text-decoration:underline;font-size:15px}
.hl{outline:3px solid var(--gold)!important;outline-offset:3px;border-radius:var(--r-small)}

/* SIGNUP */
.signup{min-height:calc(100vh / var(--z,1));display:flex;align-items:center;justify-content:center;padding:24px}
.signup .card{max-width:460px;width:100%;padding:28px}
.dots{display:flex;gap:6px;margin-bottom:14px}.dots i{width:28px;height:5px;border-radius:9px;background:var(--surf2)}.dots i.on{background:var(--brand)}
.offline{background:var(--surf2);color:var(--muted);font-size:14px;padding:6px 20px;text-align:center}

/* PHONE */
@media (max-width:760px){
  :root{--fs:17px}
  .app,.app.closed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 18% 0 0;z-index:50;transform:translateX(-102%);transition:transform .25s;visibility:visible!important}
  .app.drawer .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .top{padding:8px 10px;min-height:56px}
  .top .tabs,.dsk{display:none!important}
  .phonly{display:flex}
  .top .ptitle{font-family:var(--head);font-size:24px;font-weight:700;margin-right:auto}
  .wrap{padding:16px 16px 24px}
  .view{padding-bottom:150px}
  .dock{position:fixed;left:0;right:0;bottom:64px;padding:8px 10px;z-index:20}
  .dock .ask input{font-size:16px;padding:8px 4px}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);height:64px;z-index:25}
  .bottom button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted)}
  .bottom button .pill{padding:3px 16px;border-radius:999px}
  .bottom button.on{color:var(--ink);font-weight:700}
  .bottom button.on .pill{background:var(--surf2)}

button,.btn,.box,.chatlink,.carrow,.saved,.chip,.tabbtn,.iconbtn,.opt,.ranges button,.switch button,input,select{transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),transform .16s var(--ease)}
:focus-visible{outline:none;box-shadow:var(--ring)!important;border-radius:var(--r-small)}
.num,.price,.big,.pcard b,.rows td,.kv b,.saved b,.carrow .p,.badge{font-variant-numeric:tabular-nums}
h1,h2,h3,.head{letter-spacing:-.02em}

/* shell */

function comboItems(box){
 const q=box.querySelector('input').value.trim().toLowerCase();
 let all;
 if(box.dataset.kind==='make'){all=Object.keys(MAKES)}
 else{const mk=(box.closest('.card').querySelector('.combo[data-kind=make] input').value||'').trim().toLowerCase();const k=Object.keys(MAKES).find(x=>x.toLowerCase()===mk);all=k?MAKES[k]:[].concat(...Object.entries(MAKES).map(([m,l])=>l.map(x=>m+' '+x)))}
 const hit=q?all.filter(x=>x.toLowerCase().includes(q)).sort((a,b)=>a.toLowerCase().indexOf(q)-b.toLowerCase().indexOf(q)):all;
 return hit.slice(0,40);
}
function comboOpen(box){
 const list=box.querySelector('.combo-list'),items=comboItems(box),q=box.querySelector('input').value.trim();
 const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 const hl=s=>{if(!q)return esc(s);const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(s):esc(s.slice(0,i))+'<b>'+esc(s.slice(i,i+q.length))+'</b>'+esc(s.slice(i+q.length))};

 box.classList.toggle('open',list.children.length>0);
}

function hotList(f,mode='hot'){
 const sk=f.sort||(mode==='volume'?'u':'d');const srt=mode==='top'?(a,b)=>b.sc-a.sc:HSORT[sk][1];

 if(!hit.length){near=true;const off=(v,lo,hi,sp)=>v<lo?(lo-v)/sp:v>hi?(v-hi)/sp:0;
  hit=SRC.map(w=>({...w,_d:off(w.y,f.y[0],f.y[1],66)+off(w.v,f.b[0],f.b[1],475000)+off(w.hp,f.hp[0],f.hp[1],280)})).sort((a,b)=>a._d-b._d).slice(0,5).sort(srt)}
 const out=w=>{const m=[];if(w.y<f.y[0]||w.y>f.y[1])m.push(w.y);if(w.v<f.b[0]||w.v>f.b[1])m.push(money(w.v));if(w.hp<f.hp[0]||w.hp>f.hp[1])m.push(w.hp+' hp');return m.join(', ')};

 ${hit.length>1?`<table class="rows" style="margin-top:14px"><tr><th>Runners-up</th><th class="num">Days</th><th class="num">Sold</th><th class="num">Score</th></tr>${hit.slice(1).map(w=>`<tr><td>${nm(w)}</td><td class="num">${w.d}</td><td class="num">${w.u}</td><td class="num">${w.sc}</td></tr>`).join('')}</table>`:''}`}
 return `${head}<table class="rows" style="margin-top:12px"><tr><th>Model</th><th class="num">Days</th><th class="num">vs last month</th></tr>

function lotValueSeries(){
 const ago=t=>t==='today'?0:parseInt(t);const pts=[];
 for(let d=90;d>=0;d--){let v=0;LOT.forEach(c=>{if(c.days>=d){let pr=c.hist[0][1];c.hist.forEach(h=>{if(ago(h[2])>=d)pr=h[1]});v+=pr}});SOLD.forEach(c=>{if(d>c.ago&&d<=c.ago+c.days)v+=c.price});pts.push([d,v])}
 return pts;
}
function lotChartSvg(W,H){
 const ser=lotValueSeries(),mx=Math.max(...ser.map(p=>p[1]))*1.08,L=70,B=24;
 const X=d=>L+(90-d)/90*(W-L-8),Y=v=>8+(1-v/mx)*(H-B-8);
 const sm=ser.map((p,i)=>{if(i===0||i===ser.length-1)return p;let a=0,n=0;for(let j=i-7;j<=i+7;j++){if(j>=0&&j<ser.length){a+=ser[j][1];n++}}return [p[0],a/n]});
 const P=sm.filter((p,i)=>i%3===0||i===sm.length-1).map(p=>[X(p[0]),Y(p[1])]);
 let path='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;path+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)}
 const last=ser[ser.length-1];
 const grid=[.25,.5,.75,1].map(f=>{const v=mx/1.08*f;return `<line x1="${L}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${money(v)}</text>`}).join('');
 const xl=[[90,'90 days ago','start'],[60,'60','middle'],[30,'30','middle'],[0,'Today','end']].map(a=>`<text x="${X(a[0])}" y="${H-4}" text-anchor="${a[2]}">${a[1]}</text>`).join('');
 const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lot value over the last 90 days, now ${money(last[1])}">${grid}<path d="${path} V${Y(0)} H${X(90)} Z" fill="var(--brand)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(0)}" cy="${Y(last[1])}" r="4" fill="var(--brand)"/>${xl}</svg>`;
 return svg;
}

function bestList(){
 const f=S.invF;let hit=MKT.filter(w=>(f.cat==='Any'||w.cat===f.cat)&&(f.c==='Any'||w.c===f.c)&&w.y>=f.y[0]&&w.y<=f.y[1]&&w.v>=f.b[0]&&w.v<=f.b[1]&&w.hp>=f.hp[0]&&w.hp<=f.hp[1]).sort((a,b)=>b.g-a.g);
 let near=false;
 if(!hit.length){near=true;
  const off=(v,lo,hi,span)=>v<lo?(lo-v)/span:v>hi?(v-hi)/span:0;
  const miss=w=>{const m=[];if(f.cat!=='Any'&&w.cat!==f.cat)m.push(w.cat);if(f.c!=='Any'&&w.c!==f.c)m.push(w.c);if(w.y<f.y[0]||w.y>f.y[1])m.push(String(w.y));if(w.v<f.b[0]||w.v>f.b[1])m.push(money(w.v));if(w.hp<f.hp[0]||w.hp>f.hp[1])m.push(w.hp+' hp');return m};

function ibxPriceLine(t){const c=ibxCar(t);
 if(t.side==='Sell')return `Your price ${money(c.you)} · market ${money(c.mkt)} · ${c.days} days on lot`;
 return c.price?`Asking ${money(c.price)}${c.mkt?' · market '+money(c.mkt):''}`:'';}
function ibxRows(){
 const L=IBX.filter(t=>t.side===IB.side&&(IB.pl==='all'||t.pl===IB.pl)&&(IB.stage==='all'||t.stage===IB.stage));
 if(!L.length)return `<div class="ibx-empty">No conversations here yet.</div>`;
 return L.map(t=>{const c=ibxCar(t);return `<button class="thr ${t.unread?'unread':''} ${IB.open===t.id?'on':''}" data-ith="${t.id}">
  <div class="r1"><span class="nm">${t.name}</span><span class="tm">${t.t}</span></div>

 const t=IBX.find(x=>x.id===IB.open);
 if(!t)return `<div class="ibx-empty"><b style="color:var(--ink)">Pick a conversation</b><br>Every message from every site lands here. Reply from one box, it goes out on the same channel.</div>`;
 const c=ibxCar(t),last=t.msgs[t.msgs.length-1][0]==='them';
 const ai=t.side==='Sell'?['Counter at market price','Book a viewing','Send the PPI report']:['Offer 3% under market','Ask for service records','Book an inspection'];
 return `<div class="ibx-th-head"><button class="iconbtn phonly" data-act="ibxback" aria-label="Back to conversations">${ic('back')}</button><div class="who"><h3>${t.name}</h3>
  <div class="meta"><span class="pl">${IBX_PL[t.pl]}</span><span>${t.side==='Sell'?'Wants your':'Selling a'} <b>${c.y} ${c.md}</b></span></div></div>
  <button class="btn sm" data-${t.side==='Sell'?'lotcar':'car'}="${t.car}">Open car</button></div>
 <div class="ibx-crm"><span class="hint">Stage</span>${IBX_ST.map(s=>`<button class="stbtn ${t.stage===s?'on':''}" data-ist="${s}">${s}</button>`).join('')}<span class="money">${ibxPriceLine(t)}</span></div>
 <div class="ibx-msgs" id="ibxmsgs"><div class="ibx-note">Conversation on ${IBX_PL[t.pl]}</div>${t.msgs.map(m=>`<div class="bub ${m[0]==='me'?'me':''}">${m[1]}<span class="bt">${m[2]}</span></div>`).join('')}</div>
 ${last?`<div class="ibx-ai"><span class="hint" style="align-self:center">Suggested reply:</span>${ai.map(a=>`<button class="chip" data-iai="${a}">${a}</button>`).join('')}</div>`:''}
 <form class="ibx-compose" onsubmit="return false"><input type="text" id="ibxin" placeholder="Reply to ${t.name.split(' ')[0]}" aria-label="Reply"><span class="via">via ${IBX_PL[t.pl]}</span><button class="btn main sm" data-act="ibxsend">Send</button></form>`;}
function ibxCounts(){return IBX_ST.map(s=>`<button class="st ${IB.stage===s?'on':''}" data-istf="${s}"><b>${IBX.filter(t=>t.side===IB.side&&t.stage===s).length}</b>${s}</button>`).join('')}

 let w=document.getElementById('ibxwrap');
 if(!w){w=document.createElement('div');w.id='ibxwrap';w.className='ibxwrap';document.body.appendChild(w)}

/* ===== Motion + polish layer (Thomas 13.11.2026): page fade-in, scroll reveal, count-up, chart draw, sticky hairline, Esc = back ===== */
(function(){
 const RM=matchMedia('(prefers-reduced-motion: reduce)');
 const _render=render;let lastKey=null;
 render=function(sc){
  const k=[S.signedUp,S.tab,S.scr,S.arg,S.chatId,S.invMode,S.lotEmpty,S._loading].join('|');
  const changed=k!==lastKey;lastKey=k;
  _render(sc);
  const v=document.getElementById('view');if(!v)return;
  v.classList.toggle('scrolled',v.scrollTop>8);
  if(!changed||RM.matches)return;
  v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');
  clearTimeout(v._et);v._et=setTimeout(()=>v.classList.remove('enter'),420);
  reveal(v);countUp(v);drawLines(v);
 };
 let io=null;
 function reveal(v){
  if(io)io.disconnect();
  const all=[...v.querySelectorAll('.card,.lotcard,.lotstats>div,.pstrip>div,.chartbox,.ltile,.sect,.carrow,.box,.lotcharts')];
  const top=all.filter(e=>!e.closest('details')&&!all.some(o=>o!==e&&o.contains(e)));
  const vb=v.getBoundingClientRect().bottom;
  const below=top.filter(e=>e.getBoundingClientRect().top>vb-8);
  if(!below.length)return;
  io=new IntersectionObserver(ents=>{let i=0;ents.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
   setTimeout(()=>{el.classList.add('in');const done=()=>{el.classList.remove('rv','in');el.removeEventListener('transitionend',done)};el.addEventListener('transitionend',done);setTimeout(done,800)},Math.min(i++,4)*55)})},{root:v,rootMargin:'0px 0px -5% 0px'});
  below.forEach(e=>{e.classList.add('rv');io.observe(e)});
 }
 function countUp(v){
  v.querySelectorAll('.lotstats b,.pstrip>div>b,.ltb .lv').forEach(el=>{
   if(el.children.length)return;const t=el.textContent;const m=t.match(/^([^\d]*)([\d][\d,]*\.?\d*)(.*)$/);if(!m)return;
   const raw=m[2],n=parseFloat(raw.replace(/,/g,''));if(!isFinite(n)||n===0)return;
   const dec=(raw.split('.')[1]||'').length,comma=raw.includes(',');
   const fmt=x=>comma?x.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):x.toFixed(dec);
   const from=n*0.82,t0=performance.now(),D=610;
   (function step(now){const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);if(!el.isConnected)return;
    el.textContent=p<1?m[1]+fmt(from+(n-from)*e)+m[3]:t;if(p<1)requestAnimationFrame(step)})(t0);
   setTimeout(()=>{if(el.isConnected)el.textContent=t},D+150);
  });
 }
 function drawLines(v){
  v.querySelectorAll('#lotchart path,#lotchart polyline,#chart path,#chart polyline').forEach(p=>{
   const cs=getComputedStyle(p);if(cs.stroke==='none'||(cs.fill!=='none'&&!/rgba\(0, 0, 0, 0\)/.test(cs.fill)))return;
   if(cs.strokeDasharray!=='none'||p.getAttribute('stroke-dasharray'))return;
   let L=0;try{L=p.getTotalLength()}catch(e){}if(L<80)return;
   p.style.setProperty('--len',Math.ceil(L));p.classList.remove('draw');void p.getBBox();p.classList.add('draw');
  });
 }
 document.addEventListener('scroll',e=>{const v=e.target;if(!v||v.id!=='view')return;v.classList.toggle('scrolled',v.scrollTop>8);
  const b=v.getBoundingClientRect().bottom;v.querySelectorAll('.rv:not(.in)').forEach(el=>{if(el.getBoundingClientRect().top<b){io&&io.unobserve(el);el.classList.add('in');setTimeout(()=>el.classList.remove('rv','in'),800)}})},true);
 document.addEventListener('keydown',e=>{
  if(e.key!=='Escape'||e.defaultPrevented)return;
  if(document.querySelector('.pop,.scrim,#ibxwrap,.combo.open,.tour'))return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  if(S.stack&&S.stack.length)back();
 });
})();

const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const RX=new RegExp('(^|[^A-Za-z0-9])('+P.map(p=>esc(p[0])).join('|')+')(?![A-Za-z0-9])','g');const M=Object.fromEntries(P);

function walk(n){if(n.nodeType===3){const v=sw(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}

 ['placeholder','title','aria-label'].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v){const w=sw(v);if(w!==v)n.setAttribute(a,w)}});

let busy=false;const mo=new MutationObserver(ms=>{if(busy)return;busy=true;for(const m of ms){if(m.type==='characterData')walk(m.target);else m.addedNodes.forEach(walk)}busy=false});
function go(){walk(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true});document.title=sw(document.title)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();</script><script>document.addEventListener('click',function(e){var b=e.target.closest('[data-veh]');if(!b)return;
